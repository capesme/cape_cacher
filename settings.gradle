pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven { url = "https://maven.kikugie.dev/snapshots" }
        maven { url = "https://maven.kikugie.dev/releases" }
        gradlePluginPortal()
    }
}

plugins {
    id "dev.kikugie.stonecutter" version "0.7-alpha.14"
}

stonecutter {
    create(rootProject) {
        versions '1.21.5', '1.21', '1.20.1', '1.20.4'
        vcsVersion = '1.20.1'
    }
}
